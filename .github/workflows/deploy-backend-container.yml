name: Deploy Backend Container to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-container.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build, Push & Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: coachacrstudent.azurecr.io
          registryUsername: ${{ secrets.COACHBACKENDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.COACHBACKENDAPP_REGISTRY_PASSWORD }}
          containerAppName: coach-backend-korea
          resourceGroup: rg-containers-student
          imageToBuild: coachacrstudent.azurecr.io/coach-backend-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
