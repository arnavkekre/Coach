name: Deploy Backend Container to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: coachacrstudent.azurecr.io
          username: ${{ secrets.COACHBACKENDAPP_REGISTRY_USERNAME }}
          password: ${{ secrets.COACHBACKENDAPP_REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: coachacrstudent.azurecr.io/coach-backend-app:latest
