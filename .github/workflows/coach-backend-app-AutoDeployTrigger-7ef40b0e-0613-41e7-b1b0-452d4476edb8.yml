name: Trigger auto deployment for coach-backend-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/coach-backend-app-AutoDeployTrigger-7ef40b0e-0613-41e7-b1b0-452d4476edb8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.COACHBACKENDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.COACHBACKENDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.COACHBACKENDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: arnavcoachacr2026.azurecr.io
          registryUsername: ${{ secrets.COACHBACKENDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.COACHBACKENDAPP_REGISTRY_PASSWORD }}
          containerAppName: coach-backend-app
          resourceGroup: rg-containers-practice
          imageToBuild: arnavcoachacr2026.azurecr.io/coach-backend-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


